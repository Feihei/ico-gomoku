<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>球面五子棋</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div id="canvas-container"></div>

    <!-- 左上角可折叠信息/控制面板（默认展开；收起后棋盘区域全幅可见） -->
    <aside id="hud">
      <button id="btn-collapse" type="button" title="收起 / 展开面板">X</button>
      <div class="hud-status">
        <span class="status-item">手数：<b id="status-turn">0</b></span>
        <span class="status-item">执子方：<b id="status-player">黑方</b></span>
        <span class="status-item">模式：<b id="status-mode">PvP</b></span>
        <span class="status-message" id="status-message">对局开始，黑先</span>
      </div>
      <div class="hud-controls">
        <button id="btn-new" type="button">新对局</button>
        <button id="btn-undo" type="button">悔棋</button>
        <label>细分频率：
          <select id="sel-freq">
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5" selected>5</option>
            <option value="6">6</option>
          </select>
        </label>
      </div>
    </aside>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "./js/vendor/three.module.js",
      "three/addons/controls/OrbitControls.js": "./js/vendor/OrbitControls.js"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
