<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>你会玩个球五子棋</title>
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 首屏加载提示：three.js 等模块经 CDN 首次下载较慢，初始化完成后隐藏 -->
  <div id="loading-overlay">
    <span>加载中</span>
  </div>
  <!-- 兜底：模块（three.js CDN）加载失败时 main.js 不会执行、加载层会一直停留。
       注意：不能用固定短超时当失败信号——首次访问冷下载 CDN 常超过 8s，会误报失败。
       正确做法：监听模块脚本加载 error 事件（真失败立即提示）+ 30s 长超时仅作最后保险 -->
  <script>
    (function () {
      const overlay = document.getElementById('loading-overlay');
      let failed = false;
      function showFail() {
        if (failed) return;
        failed = true;
        overlay.textContent = '加载失败，请刷新';
      }
      // 任一脚本/模块（含 three.js）资源加载失败 → 立即提示；运行时异常不在此列
      window.addEventListener('error', (e) => {
        const t = e && e.target;
        if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK' || t.tagName === 'IMG')) showFail();
      }, true);
      // 最后保险：30 秒仍未就绪才提示失败（覆盖"卡住但不报错"的极端情况）
      setTimeout(() => {
        if (overlay && overlay.style.display !== 'none' && !failed) showFail();
      }, 30000);
    })();
  </script>
  <div id="app">
    <div id="canvas-container"></div>
    <!-- 最上层纸纹噪波覆盖层（全视口统一颗粒，兼盖 WebGL 与 UI） -->
    <div id="paper-noise"></div>

    <!-- 左侧竖向工具 bar（✕ 置最左上角收起，其余区域全幅展示棋盘） -->
    <aside id="hud">
      <div id="hud-head">
        <button id="btn-collapse" type="button" title="收起 / 展开面板">✕</button>
        <button id="btn-info" type="button" title="游戏说明">i</button>
      </div>
      <div id="hud-body">
        <button id="btn-mode" type="button">双人</button>
        <button id="btn-color" type="button">执白</button>
        <button id="btn-freq" type="button">细分六</button>
        <button id="btn-new" type="button">新对局</button>
        <button id="btn-undo" type="button">悔棋</button>
        <button id="btn-export" type="button">导出棋局</button>
        <div id="hud-info">
          <div>模式：<b id="status-mode">人机</b></div>
          <div>棋盘：<b id="status-board">细分五</b></div>
          <div>手数：<b id="status-turn">0</b></div>
          <div id="status-player-row">执子方：<b id="status-player">黑方</b></div>
          <div id="status-message"></div>
        </div>
      </div>
      <!-- 展开态时 i 按钮的落点：位于 bar 最下方（折叠时由 JS 移回 hud-head） -->
      <div id="hud-info-slot"></div>
    </aside>

    <!-- 中央大字胜负提示（默认隐藏） -->
    <div id="win-overlay" hidden>
      <span id="win-text"></span>
    </div>

    <!-- 游戏说明：全屏展示 info.txt（默认隐藏，点 X 退出） -->
    <div id="info-modal" hidden>
      <div id="info-panel">
        <button id="btn-info-close" type="button" title="关闭说明">✕</button>
        <pre id="info-text"></pre>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
      "three/addons/controls/OrbitControls.js": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/controls/OrbitControls.js"
    }
  }
  </script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
